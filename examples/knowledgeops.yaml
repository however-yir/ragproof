# ragproof configuration for knowledgeops-agent
# Endpoint: POST /ai/react/chat (structured answer, evidence, citations, fallback)
#
# Prerequisites:
#   1. knowledgeops-agent running at http://localhost:8080
#   2. Set env var: KNOWLEDGEOPS_API_KEY=<your-dev-api-key>
#      (see .env.example in knowledgeops-agent repo)
#   3. Seed the KnowledgeOps knowledge base with the documents represented by
#      this dataset before using it as a quality gate.

name: knowledgeops-rag-eval

dataset: examples/dataset.knowledgeops.jsonl

adapter:
  type: http
  base_url: http://localhost:8080
  endpoint: /ai/react/chat
  method: POST
  headers:
    X-API-Key: "${KNOWLEDGEOPS_API_KEY}"
    Content-Type: application/json
    X-Tenant-Id: "demo-tenant"
  json_field: prompt
  extra_json:
    chatId: "eval-session-001"
    modelProfile: "quality"
  answer_path: answer
  contexts_path: evidence
  citations_path: citations
  fallback_path: fallback
  expected_fallback: false
  timeout: 60.0

judge:
  enabled: false
  # Enable only when a judge endpoint and model version are explicitly chosen.
  base_url: http://localhost:11434/v1
  api_key_env: RAGPROOF_JUDGE_API_KEY   # set to any string for Ollama
  model: qwen2.5:7b
  skip_on_error: true                   # gracefully skip if Ollama is not running

concurrency: 2
retries: 1
top_k: 5
