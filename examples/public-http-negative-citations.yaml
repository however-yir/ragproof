name: public-http-negative-citations
dataset: examples/dataset.public-http.en.jsonl

adapter:
  type: http
  base_url: http://127.0.0.1:8766
  endpoint: /query
  method: POST
  json_field: question
  extra_json:
    top_k: 3
    mode: missing_citations
  answer_path: answer
  contexts_path: contexts
  context_id_path: id
  context_text_path: text
  citations_path: citations

judge:
  enabled: false

concurrency: 2
top_k: 3
min_sample_count: 60
