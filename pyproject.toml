[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragproof"
version = "0.3.0"
description = "Framework-agnostic RAG evaluation and regression-testing CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "however-yir" }]
keywords = ["rag", "llm", "evaluation", "regression", "faithfulness", "retrieval"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
ragproof = "ragproof.cli:cli"

[project.entry-points."ragproof.adapters"]
# Third-party packages can register a named adapter without changing ragproof.
# Example: my-ragproof-plugin = "my_package:build_adapter"

[project.urls]
Homepage = "https://github.com/however-yir/ragproof"

[tool.setuptools.packages.find]
include = ["ragproof*"]

[tool.setuptools.package-data]
ragproof = ["templates/*.html.j2", "templates/*.md.j2"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["docs/assets"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.coverage.run]
source = ["ragproof"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
