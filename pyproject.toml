[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "ragproof-cli"
version = "0.4.1"
description = "Framework-agnostic RAG evaluation and regression-testing CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "however-yir" }]
keywords = ["rag", "llm", "evaluation", "regression", "faithfulness", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.0",
]
excel = [
    "openpyxl>=3.1",
]
parquet = [
    "pandas>=2.1",
    "pyarrow>=15",
]
docs = [
    "jieba>=0.42,<1",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "hypothesis>=6.100",
    "jsonschema>=4.22",
    "yamllint>=1.35",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
ragproof = "ragproof.cli:cli"

[project.entry-points."ragproof.adapters"]
# Third-party packages can register a named adapter without changing ragproof.
# Example: my-ragproof-plugin = "my_package:build_adapter"

[project.urls]
Homepage = "https://github.com/however-yir/ragproof"
Documentation = "https://however-yir.github.io/ragproof/"
Repository = "https://github.com/however-yir/ragproof"
Issues = "https://github.com/however-yir/ragproof/issues"
Changelog = "https://github.com/however-yir/ragproof/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ragproof*"]

[tool.setuptools.package-data]
ragproof = ["templates/*.html.j2", "templates/*.md.j2", "schemas/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["docs/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["ragproof"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
