name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --cov=ragproof --cov-report=term-missing --cov-report=xml

      - name: Lint
        run: ruff check ragproof tests

      - name: Type check
        run: mypy ragproof --ignore-missing-imports

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Mock end-to-end smoke
        run: |
          ragproof run -c examples/mock.yaml -o runs/ci.json
          ragproof compare --baseline runs/ci.json --current runs/ci.json --threshold "error_rate=0.0"
          ragproof report runs/ci.json -o runs/ci-report.html
          ragproof report runs/ci.json -o runs/ci-report.csv
