name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --cov=ragproof --cov-fail-under=75 --cov-report=term-missing --cov-report=xml

      - name: Enforce core coverage floors
        run: |
          coverage report --include='ragproof/runner.py' --fail-under=80
          coverage report --include='ragproof/adapters/http.py' --fail-under=70
          coverage report --include='ragproof/compare.py' --fail-under=85
          coverage report --include='ragproof/dataset.py' --fail-under=65
          coverage report --include='ragproof/report.py' --fail-under=60
          coverage report --include='ragproof/cli.py' --fail-under=60

      - name: Lint
        run: ruff check ragproof tests

      - name: Type check
        run: mypy ragproof --ignore-missing-imports

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Mock end-to-end smoke
        run: |
          ragproof run -c examples/mock.yaml -o runs/ci.json
          ragproof compare --baseline runs/ci.json --current runs/ci.json --threshold "error_rate=0.0"
          ragproof report runs/ci.json -o runs/ci-report.html
          ragproof report runs/ci.json -o runs/ci-report.csv
          ragproof report runs/ci.json -o runs/ci-report.xml
          ragproof report runs/ci.json -o runs/ci-report.sarif
          ragproof dataset-manifest examples/dataset.sample.jsonl --json
          ragproof dataset-lint examples/dataset.sample.jsonl
          ragproof benchmark-manifest-lint examples/benchmark-manifest.json
          ragproof trend runs/ci.json -o runs/ci-trend.json

      - name: Public HTTP benchmark gate
        run: |
          python examples/public_benchmark_server.py &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8766/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8766/health
          ragproof run -c examples/public-http-benchmark.yaml -o runs/public-http-current.json
          ragproof compare \
            --baseline examples/baselines/public-http-v0.4.1.json \
            --current runs/public-http-current.json \
            --threshold "recall@3=1.0" \
            --threshold "mrr=1.0" \
            --threshold "citation_validity=1.0" \
            --max "error_rate=0.0"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies
        run: |
          python -m pip install --upgrade pip-audit
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          target = Path(os.environ["RUNNER_TEMP"]) / "ragproof-runtime-requirements.txt"
          target.write_text("\n".join(project["dependencies"]) + "\n", encoding="utf-8")
          PY
          pip-audit --requirement "$RUNNER_TEMP/ragproof-runtime-requirements.txt" --strict
