name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine cyclonedx-bom
          python -m build
          twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv .release-venv
          .release-venv/bin/pip install dist/*.whl
          .release-venv/bin/ragproof --version
          .release-venv/bin/ragproof run -c examples/mock.yaml -o .release-smoke/run.json
          .release-venv/bin/ragproof report .release-smoke/run.json -o .release-smoke/report.html
      - name: Generate SBOM and SHA256 checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          cyclonedx-py environment \
            --pyproject pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-file "dist/ragproof-${version}.cdx.json" \
            .release-venv/bin/python
          find dist -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          sha256sum --check dist/SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    if: ${{ vars.RAGPROOF_PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist
      - name: Select Python distributions
        run: |
          mkdir publish-dist
          find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} publish-dist/ \;
          test -n "$(find publish-dist -type f -print -quit)"
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish-dist/

  release:
    needs: [build, publish]
    if: ${{ always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist
      - name: Extract version notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            /^## / && found { exit }
            index($0, "## " version " ") == 1 { found = 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "ragproof $version" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "ragproof $version" --notes-file release-notes.md dist/*
          fi
